<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>PAWSE MAGAZINE BULLDOG GAME</title>
  <!-- 8비트 레트로 폰트 및 한국어 폰트 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+KR:wght@700;900&display=swap" rel="stylesheet">
  
  <!-- Firebase SDK (v9 호환 모드) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: manipulation;
    }

    body {
      background-color: #0b0c10;
      font-family: 'Press Start 2P', monospace;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      padding: 12px 10px 40px;
      overflow-x: hidden;
    }

    .game-cabinet {
      position: relative;
      background: #1f2833;
      border: 5px solid #c5a059;
      border-radius: 14px;
      padding: 12px;
      box-shadow: 0 0 35px rgba(0, 0, 0, 0.95);
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 460px;
    }

    .hud {
      width: 100%;
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 11px;
      color: #ffde59;
      text-shadow: 2px 2px #000;
    }

    .screen-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 240 / 180;
      border: 3px solid #45a29e;
      border-radius: 8px;
      overflow: hidden;
      background: #111;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    .screen-wrapper::after {
      content: " ";
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%);
      background-size: 100% 4px;
      pointer-events: none;
    }

    .danger-meter-wrapper {
      width: 100%;
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .danger-label {
      font-size: 10px;
      color: #ff5252;
      display: flex;
      justify-content: space-between;
      text-shadow: 1px 1px #000;
    }

    .meter-border {
      width: 100%;
      height: 20px;
      background: #0b0c10;
      border: 2px solid #66fcf1;
      border-radius: 4px;
      padding: 2px;
    }

    .meter-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #4caf50, #ffeb3b 50%, #ff1744 85%);
      transition: width 0.05s linear;
    }

    .controls {
      margin-top: 12px;
      display: flex;
      width: 100%;
    }

    .steal-btn {
      font-family: 'Press Start 2P', monospace;
      border: none;
      outline: none;
      cursor: pointer;
      padding: 15px 0;
      width: 100%;
      font-size: 13px;
      color: #000;
      background: #ffde59;
      box-shadow: 0 5px 0 #b38b14, 0 6px 8px rgba(0,0,0,0.5);
      border-radius: 6px;
      transition: transform 0.05s;
      -webkit-appearance: none;
    }

    .steal-btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #b38b14;
    }

    .steal-btn:disabled {
      background: #444 !important;
      box-shadow: 0 4px 0 #222 !important;
      cursor: not-allowed;
      color: #777 !important;
    }

    .overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.94);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-evenly;
      text-align: center;
      padding: 8px 12px;
      z-index: 20;
    }

    .creator-tag {
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 11px;
      font-weight: 900;
      color: #ffde59;
      letter-spacing: 1.5px;
      text-shadow: 0 0 6px rgba(255, 222, 89, 0.8), 1px 1px 0 #000;
    }

    .overlay h2 {
      font-size: 14px;
      color: #ff3344;
      line-height: 1.3;
      letter-spacing: 0.5px;
    }

    .desc-box {
      background: rgba(18, 24, 32, 0.85);
      border: 1px solid #45a29e;
      border-radius: 6px;
      padding: 6px 8px;
      width: 95%;
    }

    .desc-box p {
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 10px;
      font-weight: 700;
      color: #ffde59;
      line-height: 1.45;
      text-shadow: 1px 1px 2px #000, -1px -1px 2px #000;
    }

    .desc-box p b {
      color: #ff5252;
    }

    .profile-setup-box {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin: 2px 0;
    }

    .slot-avatar-wrapper {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 2px solid #ffde59;
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-shadow: 0 0 8px rgba(255, 222, 89, 0.5);
      font-size: 22px;
      cursor: pointer;
    }

    .slot-spinning {
      animation: slotRoll 0.12s infinite;
    }

    @keyframes slotRoll {
      0% { transform: translateY(-8px) scale(0.9); opacity: 0.7; }
      50% { transform: translateY(0px) scale(1.1); opacity: 1; }
      100% { transform: translateY(8px) scale(0.9); opacity: 0.7; }
    }

    .name-input-box {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 3px;
    }

    .name-input-box label {
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 9px;
      color: #66fcf1;
    }

    .nickname-input {
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 12px;
      font-weight: 700;
      padding: 5px 8px;
      border: 2px solid #ffde59;
      background: #111;
      color: #fff;
      border-radius: 6px;
      text-align: center;
      outline: none;
      width: 130px;
      -webkit-appearance: none;
    }

    .paw-start-btn {
      position: relative;
      background: none;
      border: none;
      outline: none;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2px;
      -webkit-appearance: none;
      touch-action: manipulation;
    }

    .paw-start-btn:active {
      transform: scale(0.92);
    }

    .paw-start-btn svg {
      width: 90px;
      height: 70px;
      filter: drop-shadow(0 4px 0 #b38b14);
      pointer-events: none;
    }

    .paw-text {
      position: absolute;
      bottom: 11px;
      font-family: 'Press Start 2P', monospace;
      font-size: 9.5px;
      font-weight: 900;
      color: #1a0f00;
      pointer-events: none;
    }

    .gameover-actions {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      width: 100%;
    }

    .share-btn {
      font-family: 'Noto Sans KR', sans-serif;
      font-weight: 900;
      font-size: 11px;
      background: #45a29e;
      color: #fff;
      border: 2px solid #66fcf1;
      border-radius: 6px;
      padding: 6px 12px;
      cursor: pointer;
      box-shadow: 0 3px 0 #1f4a47;
      transition: transform 0.05s;
      width: 90%;
    }
    .share-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #1f4a47;
    }

    .gameover-comment-box {
      display: flex;
      width: 90%;
      gap: 4px;
    }

    .gameover-comment-input {
      flex: 1;
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 10px;
      padding: 5px 8px;
      background: #111;
      border: 1px solid #ffde59;
      border-radius: 4px;
      color: #fff;
      outline: none;
    }

    .gameover-comment-btn {
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 10px;
      font-weight: 900;
      background: #ffde59;
      color: #111;
      border: none;
      border-radius: 4px;
      padding: 0 8px;
      cursor: pointer;
    }

    .retry-btn {
      font-family: 'Press Start 2P', monospace;
      font-size: 11px;
      background: #ff3344;
      color: #fff;
      border: 2px solid #ffde59;
      border-radius: 6px;
      padding: 7px 16px;
      cursor: pointer;
      box-shadow: 0 3px 0 #900;
    }
    .retry-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #900;
    }

    .leaderboard-card {
      width: 100%;
      max-width: 460px;
      margin-top: 16px;
      background: #121820;
      border: 3px solid #ffde59;
      border-radius: 12px;
      padding: 12px;
    }

    .leaderboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      border-bottom: 2px dashed #45a29e;
      padding-bottom: 8px;
    }

    .leaderboard-title-box {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .leaderboard-title {
      font-size: 10px;
      color: #ffde59;
    }

    .stat-badge {
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 9px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 8px;
    }
    .badge-visits {
      background: #45a29e;
      color: #fff;
    }
    .badge-players {
      background: #66fcf1;
      color: #0b0c10;
    }

    .live-indicator {
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 9px;
      color: #4caf50;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .live-dot {
      width: 6px;
      height: 6px;
      background: #4caf50;
      border-radius: 50%;
    }

    .rank-list {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .rank-item {
      position: relative;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 8px;
      background: #1f2833;
      border-radius: 6px;
      font-size: 9px;
    }

    .rank-item.top1 {
      border: 2px solid #ffd700;
      background: #2b2512;
      color: #ffd700;
    }
    .rank-item.top2 {
      border: 2px solid #e0e0e0;
      background: #24292f;
      color: #e0e0e0;
    }
    .rank-item.top3 {
      border: 2px solid #cd7f32;
      background: #271e19;
      color: #e0a370;
    }

    .rank-info {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: 'Noto Sans KR', sans-serif;
      font-weight: 700;
      padding-right: 6px;
      flex: 1;
      overflow: hidden;
    }

    .rank-avatar {
      width: 22px;
      height: 22px;
      min-width: 22px;
      border-radius: 50%;
      border: 1.5px solid #66fcf1;
      background: #0b0c10;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-size: 13px;
    }

    .rank-name-text {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 120px;
    }

    .rank-score-box {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .rank-num {
      font-family: 'Press Start 2P', monospace;
      font-size: 9px;
      width: 24px;
    }

    .crown-icon { font-size: 11px; margin-right: 2px; }
    .crying-emoji { font-size: 11px; margin-left: 2px; }

    .del-rank-btn {
      background: none;
      border: none;
      color: #ff5252;
      font-size: 11px;
      font-weight: 900;
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 4px;
      opacity: 0.6;
    }
    .del-rank-btn:hover {
      opacity: 1;
      background: rgba(255, 82, 82, 0.2);
    }

    .empty-msg {
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 11px;
      color: #888;
      text-align: center;
      padding: 14px 0;
    }

    .guestbook-card {
      width: 100%;
      max-width: 460px;
      margin-top: 16px;
      background: #121820;
      border: 3px solid #66fcf1;
      border-radius: 12px;
      padding: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    .guestbook-form {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
    }

    .comment-input {
      flex: 1;
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 12px;
      padding: 8px 10px;
      background: #1a222d;
      border: 2px solid #45a29e;
      border-radius: 6px;
      color: #fff;
      outline: none;
      user-select: text !important;
      -webkit-user-select: text !important;
    }
    .comment-input:focus {
      border-color: #66fcf1;
    }

    .comment-btn {
      font-family: 'Noto Sans KR', sans-serif;
      font-weight: 900;
      font-size: 12px;
      background: #66fcf1;
      color: #0b0c10;
      border: none;
      border-radius: 6px;
      padding: 0 14px;
      cursor: pointer;
      box-shadow: 0 3px 0 #288e89;
      -webkit-appearance: none;
    }
    .comment-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #288e89;
    }

    .comment-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 220px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .comment-list::-webkit-scrollbar {
      width: 4px;
    }
    .comment-list::-webkit-scrollbar-thumb {
      background: #45a29e;
      border-radius: 4px;
    }

    .comment-item {
      position: relative;
      background: #1a222d;
      border-radius: 6px;
      padding: 8px 10px;
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 11px;
      border-left: 3px solid #ffde59;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .comment-header {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #ffde59;
      font-weight: 900;
      font-size: 11px;
      padding-right: 20px;
    }

    .comment-time {
      font-size: 9px;
      color: #888;
      font-weight: 400;
      font-family: monospace;
    }

    .comment-text {
      color: #e0e0e0;
      word-break: break-word;
      line-height: 1.4;
    }

    .del-comment-btn {
      position: absolute;
      top: 6px;
      right: 8px;
      background: none;
      border: none;
      color: #ff5252;
      font-size: 12px;
      font-weight: 900;
      cursor: pointer;
      padding: 2px 5px;
      border-radius: 4px;
    }
    .del-comment-btn:hover {
      background: rgba(255, 82, 82, 0.2);
    }

    /* ★ 레트로 SNS 공유 모달창 스타일 ★ */
    .share-modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85);
      z-index: 100;
      align-items
