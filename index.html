<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>PAWSE MAGAZINE BULLDOG GAME</title>
  <!-- 8비트 레트로 폰트 및 한국어 폰트 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+KR:wght@700;900&display=swap" rel="stylesheet">
  
  <!-- Firebase SDK (v9 호환 모드) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: manipulation;
    }

    body {
      background-color: #0b0c10;
      font-family: 'Press Start 2P', monospace;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      padding: 12px 10px 40px;
      overflow-x: hidden;
    }

    .game-cabinet {
      position: relative;
      background: #1f2833;
      border: 5px solid #c5a059;
      border-radius: 14px;
      padding: 12px;
      box-shadow: 0 0 35px rgba(0, 0, 0, 0.95);
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 460px;
    }

    .hud {
      width: 100%;
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 11px;
      color: #ffde59;
      text-shadow: 2px 2px #000;
    }

    .screen-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 240 / 180;
      border: 3px solid #45a29e;
      border-radius: 8px;
      overflow: hidden;
      background: #111;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    .screen-wrapper::after {
      content: " ";
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%);
      background-size: 100% 4px;
      pointer-events: none;
    }

    .danger-meter-wrapper {
      width: 100%;
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .danger-label {
      font-size: 10px;
      color: #ff5252;
      display: flex;
      justify-content: space-between;
      text-shadow: 1px 1px #000;
    }

    .meter-border {
      width: 100%;
      height: 20px;
      background: #0b0c10;
      border: 2px solid #66fcf1;
      border-radius: 4px;
      padding: 2px;
    }

    .meter-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #4caf50, #ffeb3b 50%, #ff1744 85%);
      transition: width 0.05s linear;
    }

    .controls {
      margin-top: 12px;
      display: flex;
      width: 100%;
    }

    .steal-btn {
      font-family: 'Press Start 2P', monospace;
      border: none;
      outline: none;
      cursor: pointer;
      padding: 15px 0;
      width: 100%;
      font-size: 13px;
      color: #000;
      background: #ffde59;
      box-shadow: 0 5px 0 #b38b14, 0 6px 8px rgba(0,0,0,0.5);
      border-radius: 6px;
      transition: transform 0.05s;
      -webkit-appearance: none;
    }

    .steal-btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #b38b14;
    }

    .steal-btn:disabled {
      background: #444 !important;
      box-shadow: 0 4px 0 #222 !important;
      cursor: not-allowed;
      color: #777 !important;
    }

    /* 오버레이 (스타트 및 게임오버) */
    .overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.94);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-evenly;
      text-align: center;
      padding: 8px 12px;
      z-index: 20;
    }

    .creator-tag {
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 11px;
      font-weight: 900;
      color: #ffde59;
      letter-spacing: 1.5px;
      text-shadow: 0 0 6px rgba(255, 222, 89, 0.8), 1px 1px 0 #000;
    }

    .overlay h2 {
      font-size: 14px;
      color: #ff3344;
      line-height: 1.3;
      letter-spacing: 0.5px;
    }

    /* 2. 설명글 가독성 강화 박스 */
    .desc-box {
      background: rgba(18, 24, 32, 0.85);
      border: 1px solid #45a29e;
      border-radius: 6px;
      padding: 6px 8px;
      width: 95%;
    }

    .desc-box p {
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 10px;
      font-weight: 700;
      color: #ffde59;
      line-height: 1.45;
      text-shadow: 1px 1px 2px #000, -1px -1px 2px #000;
    }
