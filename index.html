<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>BULLDOG GAME - Retro 8-bit Online</title>
  <!-- 8비트 레트로 폰트 및 한국어 폰트 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+KR:wght@700;900&display=swap" rel="stylesheet">
  
  <!-- Firebase SDK (v9 호환 모드) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: manipulation;
    }

    body {
      background-color: #0b0c10;
      font-family: 'Press Start 2P', monospace;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      padding: 12px 10px 30px;
      overflow-x: hidden;
    }

    .game-cabinet {
      position: relative;
      background: #1f2833;
      border: 5px solid #c5a059;
      border-radius: 14px;
      padding: 12px;
      box-shadow: 0 0 35px rgba(0, 0, 0, 0.95);
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 460px;
    }

    .hud {
      width: 100%;
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 11px;
      color: #ffde59;
      text-shadow: 2px 2px #000;
    }

    .screen-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 240 / 180;
      border: 3px solid #45a29e;
      border-radius: 8px;
      overflow: hidden;
      background: #111;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    .screen-wrapper::after {
      content: " ";
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%);
      background-size: 100% 4px;
      pointer-events: none;
    }

    .danger-meter-wrapper {
      width: 100%;
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .danger-label {
      font-size: 10px;
      color: #ff5252;
      display: flex;
      justify-content: space-between;
      text-shadow: 1px 1px #000;
    }

    .meter-border {
      width: 100%;
      height: 20px;
      background: #0b0c10;
      border: 2px solid #66fcf1;
      border-radius: 4px;
      padding: 2px;
    }

    .meter-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #4caf50, #ffeb3b 50%, #ff1744 85%);
      transition: width 0.05s linear;
    }

    .controls {
      margin-top: 12px;
      display: flex;
      width: 100%;
    }

    .steal-btn {
      font-family: 'Press Start 2P', monospace;
      border: none;
      outline: none;
      cursor: pointer;
      padding: 15px 0;
      width: 100%;
      font-size: 13px;
      color: #000;
      background: #ffde59;
      box-shadow: 0 5px 0 #b38b14, 0 6px 8px rgba(0,0,0,0.5);
      border-radius: 6px;
      transition: transform 0.05s;
      -webkit-appearance: none;
    }

    .steal-btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #b38b14;
    }

    .steal-btn:disabled {
      background: #444 !important;
      box-shadow: 0 4px 0 #222 !important;
      cursor: not-allowed;
      color: #777 !important;
    }

    /* 오버레이 창 최적화 */
    .overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.93);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-evenly;
      text-align: center;
      padding: 10px;
      z-index: 20;
    }

    .creator-tag {
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 11px;
      font-weight: 900;
      color: #ffde59;
      letter-spacing: 1px;
      text-shadow: 0 0 6px rgba(255, 222, 89, 0.8);
    }

    .overlay h2 {
      font-size: 16px;
      color: #ff3344;
      line-height: 1.2;
    }

    .overlay p {
      font-size: 9px;
      color: #c5a059;
      line-height: 1.4;
    }

    .name-input-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }

    .name-input-box label {
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 10px;
      color: #66fcf1;
    }

    .nickname-input {
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 13px;
      font-weight: 700;
      padding: 5px 10px;
      border: 2px solid #ffde59;
      background: #111;
      color: #fff;
      border-radius: 6px;
      text-align: center;
      outline: none;
      width: 150px;
      -webkit-appearance: none;
    }

    /* 발바닥 버튼 크기 및 터치 영역 확실하게 고정 */
    .paw-start-btn {
      position: relative;
      background: none;
      border: none;
      outline: none;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2px;
      -webkit-appearance: none;
      touch-action: manipulation;
    }

    .paw-start-btn:active {
      transform: scale(0.92);
    }

    .paw-start-btn svg {
      width: 95px;
      height: 75px;
      filter: drop-shadow(0 4px 0 #b38b14);
      pointer-events: none;
    }

    .paw-text {
      position: absolute;
      bottom: 12px;
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      font-weight: 900;
      color: #1a0f00;
      pointer-events: none;
    }

    .leaderboard-card {
      width: 100%;
      max-width: 460px;
      margin-top: 16px;
      background: #121820;
      border: 3px solid #ffde59;
      border-radius: 12px;
      padding: 12px;
    }

    .leaderboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      border-bottom: 2px dashed #45a29e;
      padding-bottom: 6px;
    }

    .leaderboard-title {
      font-size: 10px;
      color: #ffde59;
    }

    .live-indicator {
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 9px;
      color: #4caf50;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .live-dot {
      width: 6px;
      height: 6px;
      background: #4caf50;
      border-radius: 50%;
    }

    .rank-list {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .rank-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 10px;
      background: #1f2833;
      border-radius: 6px;
      font-size: 9px;
    }

    .rank-item.top1 {
      border: 2px solid #ffd700;
      background: #2b2512;
      color: #ffd700;
    }
    .rank-item.top2 {
      border: 2px solid #e0e0e0;
      background: #24292f;
      color: #e0e0e0;
    }
    .rank-item.top3 {
      border: 2px solid #cd7f32;
      background: #271e19;
      color: #e0a370;
    }

    .rank-info {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: 'Noto Sans KR', sans-serif;
      font-weight: 700;
    }

    .rank-num {
      font-family: 'Press Start 2P', monospace;
      font-size: 9px;
      width: 26px;
    }

    .crown-icon { font-size: 11px; margin-right: 2px; }
    .crying-emoji { font-size: 11px; margin-left: 2px; }

    .empty-msg {
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 11px;
      color: #888;
      text-align: center;
      padding: 14px 0;
    }
  </style>
</head>
<body>

  <div class="game-cabinet">
    <div class="hud">
      <div>BONES: <span id="scoreVal">0</span></div>
      <div>TIME: <span id="timeVal">45</span>s</div>
    </div>

    <div class="screen-wrapper">
      <canvas id="gameCanvas" width="240" height="180"></canvas>
      
      <div id="gameOverlay" class="overlay">
        <div class="creator-tag">X-SPACE 배솔찬이 만든</div>
        <h2 id="overlayTitle">BULLDOG GAME</h2>
        <p id="overlayDesc">
          ⚠️ 예민보스 불독의 뼈를 훔치세요!<br>
          불독이 <b>Grrr.. 뒤척일 때</b> 건드리면 극대노!<br>
          분노 100%면 기상 후 물림!
        </p>

        <div class="name-input-box" id="nameBox">
          <label>참가자 닉네임</label>
          <input type="text" id="playerNickname" class="nickname-input" placeholder="닉네임 입력" maxlength="8" value="">
        </div>
        
        <button class="paw-start-btn" id="startBtn">
          <svg viewBox="0 0 100 85">
            <ellipse cx="20" cy="22" rx="10" ry="14" fill="#ffde59" />
            <ellipse cx="40" cy="14" rx="10" ry="14" fill="#ffde59" />
            <ellipse cx="60" cy="14" rx="10" ry="14" fill="#ffde59" />
            <ellipse cx="80" cy="22" rx="10" ry="14" fill="#ffde59" />
            <path d="M22,46 C22,34 36,32 50,32 C64,32 78,34 78,46 C78,64 68,78 50,78 C32,78 22,64 22,46 Z" fill="#ffde59" />
          </svg>
          <span class="paw-text" id="startBtnText">START</span>
        </button>
      </div>
    </div>

    <div class="danger-meter-wrapper">
      <div class="danger-label">
        <span>BULLDOG ANGER</span>
        <span id="meterText">0%</span>
      </div>
      <div class="meter-border">
        <div class="meter-fill" id="meterFill"></div>
      </div>
    </div>

    <div class="controls">
      <button class="steal-btn" id="stealBtn" disabled>🦴 STEAL! (TAP)</button>
    </div>
  </div>

  <div class="leaderboard-card">
    <div class="leaderboard-header">
      <div class="leaderboard-title">🏆 LIVE LEADERBOARD (TOP 15)</div>
      <div class="live-indicator">
        <div class="live-dot"></div>
        <span>실시간 연동 중</span>
      </div>
    </div>
    <div class="rank-list" id="rankList">
      <div class="empty-msg">데이터베이스 불러오는 중...</div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBF20RxT7I3n9LD0EjDy_NDamW5V22p_7g",
      authDomain: "project-2017346322365333590.firebaseapp.com",
      projectId: "project-2017346322365333590",
      storageBucket: "project-2017346322365333590.firebasestorage.app",
      messagingSenderId: "918451681128",
      appId: "1:918451681128:web:55499be185113afa08c8dd",
      measurementId: "G-17GZKF04BJ"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;

    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function unlockAudio() {
      try {
        if (!audioCtx) audioCtx = new AudioContext();
        if (audioCtx.state === 'suspended') audioCtx.resume();
      } catch(e) {}
    }

    function playTone(freq, type, duration, vol = 0.12) {
      try {
        if (!audioCtx) return;
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch(e) {}
    }

    let score = 0;
    let timeLeft = 45;
    let anger = 0;
    let gameState = 'STOPPED';
    let dogState = 'SLEEPING';
    let dogTimer = 0;
    let stirDuration = 0;
    let handAnim = 0;
    let snoreFrame = 0;

    const scoreVal = document.getElementById('scoreVal');
    const timeVal = document.getElementById('timeVal');
    const meterFill = document.getElementById('meterFill');
    const meterText = document.getElementById('meterText');
    const stealBtn = document.getElementById('stealBtn');
    const startBtn = document.getElementById('startBtn');
    const overlay = document.getElementById('gameOverlay');
    const overlayTitle = document.getElementById('overlayTitle');
    const overlayDesc = document.getElementById('overlayDesc');
    const startBtnText = document.getElementById('startBtnText');
    const nicknameInput = document.getElementById('playerNickname');
    const nameBox = document.getElementById('nameBox');
    const rankList = document.getElementById('rankList');

    if (localStorage.getItem('bulldog_nickname')) {
      nicknameInput.value = localStorage.getItem('bulldog_nickname');
    }

    // 아이폰 사파리 터치 안정화
    startBtn.addEventListener('click', () => {
      unlockAudio();
      startGame();
    });

    stealBtn.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      unlockAudio();
      attemptSteal();
    });

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        unlockAudio();
        attemptSteal();
      }
    });

    function startGame() {
      const name = nicknameInput.value.trim() || '익명 도둑';
      localStorage.setItem('bulldog_nickname', name);

      score = 0;
      timeLeft = 45;
      anger = 0;
      dogState = 'SLEEPING';
      dogTimer = 60 + Math.random() * 60;
      gameState = 'PLAYING';

      scoreVal.innerText = score;
      timeVal.innerText = timeLeft;
      meterFill.style.width = '0%';
      meterText.innerText = '0%';
      overlay.style.display = 'none';
      stealBtn.disabled = false;
    }

    function attemptSteal() {
      if (gameState !== 'PLAYING') return;

      playTone(650, 'sine', 0.07);
      setTimeout(() => playTone(920, 'sine', 0.09), 50);

      handAnim = 8;
      score++;
      scoreVal.innerText = score;

      if (dogState === 'STIRRING') {
        anger += 45;
        playTone(210, 'sawtooth', 0.2, 0.25);
      } else {
        anger += 16 + Math.random() * 6;
      }

      if (anger >= 100) {
        anger = 100;
        triggerGameOver("ANGRY BULLDOG BITE!!");
      }
    }

    let lastTime = Date.now();
    let secondCounter = 0;

    function loop() {
      requestAnimationFrame(loop);
      const now = Date.now();
      const dt = (now - lastTime) / 1000;
      lastTime = now;

      if (gameState === 'PLAYING') {
        secondCounter += dt;
        if (secondCounter >= 1) {
          secondCounter = 0;
          timeLeft--;
          timeVal.innerText = timeLeft;
          if (timeLeft <= 0) {
            triggerGameOver(`CLEAR! MISSION SUCCESS! 🦴 x${score}`);
          }
        }

        if (anger > 0) {
          anger -= 14 * dt;
          if (anger < 0) anger = 0;
        }

        dogTimer--;
        if (dogState === 'SLEEPING') {
          if (dogTimer <= 0) {
            dogState = 'STIRRING';
            stirDuration = 45 + Math.random() * 45;
            playTone(95, 'sawtooth', 0.35, 0.2);
          }
        } else if (dogState === 'STIRRING') {
          stirDuration--;
          if (stirDuration <= 0) {
            dogState = 'SLEEPING';
            dogTimer = 55 + Math.random() * 70;
          }
        }

        meterFill.style.width = `${anger}%`;
        meterText.innerText = `${Math.floor(anger)}%`;
      }

      render();
    }

    function triggerGameOver(msg) {
      gameState = 'GAMEOVER';
      dogState = 'AWAKE';
      stealBtn.disabled = true;
      playTone(70, 'square', 0.6, 0.3);

      const currentName = nicknameInput.value.trim() || '익명 도둑';
      saveScoreToFirebase(currentName, score);

      setTimeout(() => {
        overlay.style.display = 'flex';
        overlayTitle.innerText = "GAME OVER";
        overlayDesc.innerHTML = `${msg}<br><br>훔친 뼈다귀: <b>${score}</b>개<br><span style="color:#66fcf1;font-size:9px;">온라인 랭킹에 기록되었습니다!</span>`;
        startBtnText.innerText = "RETRY";
        nameBox.style.display = 'flex';
      }, 750);
    }

    function saveScoreToFirebase(name, finalScore) {
      if (finalScore <= 0) return;
      const userDocRef = db.collection('scores').doc(name);

      userDocRef.get().then((doc) => {
        if (!doc.exists) {
          userDocRef.set({
            name: name,
            score: finalScore,
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
          });
        } else {
          const prevScore = doc.data().score || 0;
          if (finalScore > prevScore) {
            userDocRef.set({
              name: name,
              score: finalScore,
              updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            });
          }
        }
      }).catch(err => {
        console.error("점수 저장 실패:", err);
      });
    }

    db.collection('scores')
      .orderBy('score', 'desc')
      .onSnapshot((snapshot) => {
        if (snapshot.empty) {
          rankList.innerHTML = `<div class="empty-msg">아직 기록이 없습니다. 첫 챔피언이 되어보세요!</div>`;
          return;
        }

        const uniqueUsers = new Map();
        snapshot.forEach((doc) => {
          const data = doc.data();
          const userName = data.name;
          const userScore = data.score;
          if (!uniqueUsers.has(userName) || uniqueUsers.get(userName) < userScore) {
            uniqueUsers.set(userName, userScore);
          }
        });

        const sortedList = Array.from(uniqueUsers.entries())
          .map(([name, score]) => ({ name, score }))
          .sort((a, b) => b.score - a.score)
          .slice(0, 15);

        let html = '';
        let rank = 1;
        sortedList.forEach((item) => {
          let topClass = '';
          let crownTag = '';
          let emojiTag = '';

          if (rank === 1) {
            topClass = 'top1';
            crownTag = '<span class="crown-icon">👑</span>';
          } else if (rank === 2) {
            topClass = 'top2';
            crownTag = '<span class="crown-icon">🥈</span>';
          } else if (rank === 3) {
            topClass = 'top3';
            crownTag = '<span class="crown-icon">🥉</span>';
          }

          if (rank >= 10) {
            emojiTag = '<span class="crying-emoji">😭</span>';
          }

          html += `
            <div class="rank-item ${topClass}">
              <div class="rank-info">
                <span class="rank-num">#${rank}</span>
                <span>${crownTag}${item.name}${emojiTag}</span>
              </div>
              <div style="font-family:'Press Start 2P', monospace; color:#ffde59;">${item.score} 🦴</div>
            </div>
          `;
          rank++;
        });
        rankList.innerHTML = html;
      });

    function render() {
      ctx.fillStyle = '#161329';
      ctx.fillRect(0, 0, 240, 180);

      ctx.fillStyle = '#3d1c2e';
      ctx.beginPath();
      ctx.ellipse(140, 130, 95, 40, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#7a2245';
      ctx.beginPath();
      ctx.ellipse(150, 120, 72, 30, 0, 0, Math.PI * 2);
      ctx.fill();

      drawBigHeadBulldog();
      drawBoneBowl();

      if (handAnim > 0) {
        drawThiefHand();
        handAnim--;
      }

      if (dogState === 'SLEEPING' && gameState === 'PLAYING') {
        snoreFrame = (snoreFrame + 0.05) % 3;
        ctx.fillStyle = '#66fcf1';
        ctx.font = '10px monospace';
        ctx.fillText('Z', 185, 48 - snoreFrame * 5);
        ctx.fillText('z', 198, 36 - snoreFrame * 5);
      } else if (dogState === 'STIRRING') {
        ctx.fillStyle = '#ffde59';
        ctx.font = '11px monospace';
        ctx.fillText('GRRR..!!', 155, 38 + Math.sin(Date.now() / 70) * 3);
      }
    }

    function drawBigHeadBulldog() {
      ctx.save();
      let shakeX = 0;
      let shakeY = 0;

      if (dogState === 'STIRRING') {
        shakeX = (Math.random() - 0.5) * 4;
        shakeY = (Math.random() - 0.5) * 3;
      } else if (dogState === 'AWAKE') {
        shakeX = (Math.random() - 0.5) * 7;
        shakeY = (Math.random() - 0.5) * 5;
      }

      ctx.translate(shakeX, shakeY);

      ctx.fillStyle = '#8b5a36';
      ctx.beginPath();
      ctx.ellipse(180, 112, 35, 22, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#6f4422';
      ctx.fillRect(195, 122, 14, 10);

      ctx.fillStyle = '#d90429';
      ctx.fillRect(150, 84, 12, 38);
      ctx.fillStyle = '#edf2f4';
      ctx.fillRect(154, 89, 5, 5);
      ctx.fillRect(154, 102, 5, 5);
      ctx.fillRect(154, 114, 5, 5);

      ctx.fillStyle = '#a77048';
      ctx.beginPath();
      ctx.ellipse(126, 89, 42, 36, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#5c381c';
      ctx.beginPath();
      ctx.ellipse(140, 60, 12, 18, 0.4, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(98, 66, 10, 16, -0.3, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = '#6f4422';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(122, 68, 15, 0.5, Math.PI - 0.5);
      ctx.arc(120, 74, 18, 0.5, Math.PI - 0.5);
      ctx.stroke();

      ctx.fillStyle = '#d4a373';
      ctx.beginPath();
      ctx.ellipse(104, 100, 26, 20, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#111';
      ctx.fillRect(88, 90, 14, 10);
      ctx.fillStyle = '#444';
      ctx.fillRect(90, 92, 3, 3);

      if (dogState === 'SLEEPING') {
        ctx.strokeStyle = '#222';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(112, 80, 7, 0.2, Math.PI - 0.2);
        ctx.stroke();

        ctx.fillStyle = '#fff';
        ctx.fillRect(86, 106, 4, 6);
      } 
      else if (dogState === 'STIRRING') {
        ctx.strokeStyle = '#331100';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(102, 74);
        ctx.lineTo(118, 81);
        ctx.stroke();

        ctx.fillStyle = '#ffde59';
        ctx.fillRect(108, 77, 10, 4);
        ctx.fillStyle = '#000';
        ctx.fillRect(112, 77, 4, 4);

        ctx.fillStyle = '#1a0000';
        ctx.fillRect(86, 102, 18, 8);
        ctx.fillStyle = '#fff';
        ctx.fillRect(88, 105, 4, 5);
        ctx.fillRect(96, 105, 4, 5);
      } 
      else {
        ctx.fillStyle = '#d90429';
        ctx.beginPath();
        ctx.arc(112, 78, 11, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#ffea00';
        ctx.fillRect(108, 75, 4, 7);
        ctx.fillStyle = '#fff';
        ctx.fillRect(115, 72, 3, 3);

        ctx.strokeStyle = '#d90429';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(132, 62); ctx.lineTo(138, 68);
        ctx.moveTo(138, 62); ctx.lineTo(132, 68);
        ctx.stroke();

        ctx.fillStyle = '#4a0009';
        ctx.fillRect(80, 98, 28, 16);
        ctx.fillStyle = '#fff';
        ctx.fillRect(82, 98, 5, 7);
        ctx.fillRect(92, 98, 5, 6);
        ctx.fillRect(101, 98, 5, 7);
        ctx.fillRect(85, 107, 5, 7);
        ctx.fillRect(97, 107, 5, 7);
      }

      ctx.restore();
    }

    function drawBoneBowl() {
      ctx.fillStyle = '#2b5876';
      ctx.beginPath();
      ctx.ellipse(55, 134, 26, 11, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#1e3c50';
      ctx.fillRect(32, 134, 46, 9);

      ctx.fillStyle = '#f8f9fa';
      ctx.fillRect(40, 129, 18, 5);
      ctx.fillRect(38, 127, 5, 9);
      ctx.fillRect(55, 127, 5, 9);

      ctx.fillRect(48, 123, 18, 5);
      ctx.fillRect(46, 121, 5, 9);
      ctx.fillRect(63, 121, 5, 9);
    }

    function drawThiefHand() {
      ctx.save();
      ctx.fillStyle = '#111';
      ctx.fillRect(10, 116, 35, 16);
      ctx.fillRect(40, 120, 15, 8);

      ctx.fillStyle = '#f8f9fa';
      ctx.fillRect(48, 118, 15, 4);
      ctx.fillRect(46, 116, 4, 8);
      ctx.fillRect(60, 116, 4, 8);
      ctx.restore();
    }

    requestAnimationFrame(loop);
  </script>
